_target_: src.models.meanflow_raw_module.MeanFlowRawLitModule

# No autoencoder for raw data
# autoencoder_ckpt: null

# ----------------------------------------------------------------------
# This is an ADDITIVE copy of meanflow_raw_formula_atomwise.yaml. The only
# differences are the denoiser _target_ (MeanFlowSiTRawFormulaAtomwiseSystem)
# and three flags that add a COARSE crystal-system conditioning token on top of
# order + atomwise + formula-composition:
#
#   denoiser.use_crystal_system_embedding: true   -> add e_crystal_system to c
#   denoiser.use_spacegroup_conditioning:  false  -> fine 230-way SG NEVER used
#   conditioning.spacegroup:               true   -> let the GT SG label FLOW so
#                                                    the coarse crystal system can
#                                                    be derived from it at training
#
# The crystal system (7 classes) is derived on the fly from the space-group
# number inside the denoiser; the fine space group itself is discarded. So this
# stays formula-only in the sense that the model never depends on the full space
# group -- at inference you pass null (unconditional) or enumerate the 7 crystal
# systems across the per-formula samples. See the denoiser docstring for the
# evaluation-legitimacy note (do NOT feed the GT space group at eval).
#
# meanflow_raw_formula_atomwise.yaml / meanflow_raw_formula.yaml / meanflow_raw.yaml
# and their denoisers are completely unchanged and unaffected by this file.
# ----------------------------------------------------------------------

denoiser:
  _target_: src.models.denoisers.meanflow_sit_raw_formula_atomwise_system.MeanFlowSiTRawFormulaAtomwiseSystem
  input_size: 100
  atom_type_vocab_size: 120  # Z up to 118 + padding
  atom_type_embed_dim: 32
  coord_dim: 3
  lattice_dim: 9
  hidden_size: 768
  depth: 12
  num_heads: 12
  mlp_ratio: 4.0
  class_dropout_prob: 0.1
  num_spacegroups: 230
  predict_atom_types: true           # Output atom-type logits alongside velocity
  atom_type_condition_dropout: 0.5   # Randomly drop atom-type input so model must predict them

  # Formula-global composition embedding (same as meanflow_raw_formula.yaml).
  use_formula_embedding: true

  # Explicit per-token chemistry features (same as meanflow_raw_formula_atomwise.yaml).
  use_atomwise_features: true

  # NEW: coarse (7-class) crystal-system conditioning token, derived from the
  # space-group number passed into forward(). Default true; override with
  # diffusion_module.denoiser.use_crystal_system_embedding=false to A/B against
  # MeanFlowSiTRawFormulaAtomwise's conditioning while still using this config.
  use_crystal_system_embedding: true

  # Fine 230-way space-group conditioning is DISABLED here. The SG label is only
  # used to DERIVE the coarse crystal system (above); the full space group is
  # never embedded, so the model stays formula-only (no fine-SG dependence).
  use_spacegroup_conditioning: false

  # Periodic (Fourier) featurisation of the coordinate channels on input.
  # 0 = OFF (raw coords straight into x_embedder) — unchanged Cartesian
  # behaviour, so every existing run/checkpoint of this config is unaffected.
  # REQUIRED alongside meanflow.torus_coords=true, where a plain Linear on raw
  # fractional coords is discontinuous at the cell seam:
  #   diffusion_module.denoiser.coord_fourier_bands=8
  coord_fourier_bands: 0

# MeanFlow transport: training loss + sampler
meanflow:
  _target_: src.models.meanflow_transport.MeanFlowTransport
  flow_ratio: 0.50
  time_dist:
    - lognorm
    - -0.4
    - 1.0
  cfg_ratio: 0.10
  cfg_scale: 2.0
  jvp_api: funtorch
  atom_loss_weight: 1.0              # Cross-entropy loss for joint atom-type generation

  # ----------------------------------------------------------------------
  # Per-component (coord vs lattice) loss weighting. Inert by default: the
  # split only activates when both dims are > 0 AND the weights differ,
  # otherwise the loss is the original single pooled adaptive_l2_loss.
  # REQUIRED alongside torus_coords=true — fractional coord velocities are
  # bounded by 0.5 while lattice channels are Angstrom-scale, so one pooled
  # per-sample MSE is ~2 orders of magnitude dominated by the lattice.
  # ----------------------------------------------------------------------
  coord_loss_weight: 1.0             # Per-component coord loss weight (torus: 10.0)
  lattice_loss_weight: 1.0           # Per-component lattice loss weight (torus: 1.0)
  coord_dim: 0                       # Coord channels for split (0 = unified loss)
  lattice_dim: 0                     # Lattice channels for split (0 = unified loss)

  # ----------------------------------------------------------------------
  # Spacegroup symmetry projection (CrystalFlow-style). All flags default
  # to false — existing runs are completely unaffected. Enable from the
  # CLI / slurm script via Hydra overrides:
  #
  #   diffusion_module.meanflow.proj_lattice=true
  #   diffusion_module.meanflow.proj_coords_rotavg=true
  #   diffusion_module.meanflow.sym_loss_weight=0.1
  # ----------------------------------------------------------------------
  proj_lattice: false                # stage 1: project lattice onto SG metric-tensor subspace
  proj_coords_rotavg: false          # stage 2: rotational averaging of coord channels over SG ops
  proj_coords_anchor: false          # stage 3: Wyckoff anchor expansion (NotImplemented — needs preprocessing)
  sym_loss_weight: 0.0               # auxiliary ||u - sym(u)||^2 loss weight
  sym_coord_dim: 3                   # raw representation: 3 coord channels per token
  sym_lattice_dim: 9                 # raw representation: 9 lattice channels per token
  sym_coords_are_fractional: false   # raw mode uses Cartesian coords

  # ----------------------------------------------------------------------
  # Torus (fractional-coordinate) transport. OFF by default - existing runs
  # are completely unaffected. Enable from the CLI / slurm script via:
  #
  #   diffusion_module.meanflow.torus_coords=true
  #
  # When enabled, the coordinate channels are fractional (periodic on
  # [0, 1)^3) and use a wrapped (minimum-image) geodesic interpolation with
  # a uniform prior, instead of a Euclidean straight line with a Gaussian
  # prior on Cartesian positions.
  # ----------------------------------------------------------------------
  torus_coords: false
  torus_coord_dim: 3

augmentations:
  frac_coords: true
  pos: true

sampling:
  num_samples: 1000
  batch_size: 100
  num_sampling_steps: 1
  generate_atom_types: true  # Generate atom types from scratch — consistent with training
  target_formula: ""
  target_spacegroup: null
  compute_novelty: false
  relax_structures: false
  data_dir: ${paths.data_dir}
  visualize: true
  save_dir: ${paths.viz_dir}
  removeHs: false

conditioning:
  # Must be TRUE for this variant: the GT space-group label needs to reach the
  # denoiser so the coarse crystal system can be derived from it at training.
  # The fine space group is NOT used (denoiser.use_spacegroup_conditioning=false).
  spacegroup: true
  # Optional: order the CSP/inference formula's atoms by Pauling electronegativity
  # so inference matches the canonical (MCFlow-style) training order. Default
  # false -> legacy alphabetical order (existing runs unaffected).
  formula_order_by_en: false

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1e-4
  weight_decay: 0.0

scheduler: null
